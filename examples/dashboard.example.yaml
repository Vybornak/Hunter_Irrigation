# Hunter Irrigation dashboard example
#
# Paste this into Dashboard -> Raw configuration editor.
#
# IMPORTANT:
# 1) Replace placeholder valve entities (valve.irrigation_zone_1, valve.irrigation_zone_2)
#    with the exact zone entities you configured in integration setup.
# 2) Replace zone duration entities according to your zone names.
#    Entity format is: number.hunter_irrigation_<slugified_zone_name>_duration
#    Example: zone name "Front Lawn" -> number.hunter_irrigation_front_lawn_duration
# 3) Rain sensors are optional. Remove cards if you do not use these entities.

title: Hunter Irrigation
views:
  - title: Irrigation
    path: irrigation
    icon: mdi:sprinkler-variant
    cards:
      - type: entities
        title: Runtime controls
        show_header_toggle: false
        entities:
          - entity: switch.hunter_irrigation_manual_override
            name: Manual override
          - entity: switch.hunter_irrigation_simulation
            name: Simulation
          - entity: number.hunter_irrigation_rain_threshold
            name: Rain threshold (mm/day)

      - type: entities
        title: Rain status (optional)
        show_header_toggle: false
        entities:
          - entity: sensor.daily_rain_mm
            name: Daily rain
          - entity: sensor.instant_rain_mm
            name: Instant rain
          - entity: binary_sensor.rain_detected
            name: Rain binary sensor

      - type: entities
        title: Zone durations
        show_header_toggle: false
        entities:
          - entity: number.hunter_irrigation_zone_1_duration
            name: Zone 1 duration
          - entity: number.hunter_irrigation_zone_2_duration
            name: Zone 2 duration

      - type: horizontal-stack
        cards:
          - type: button
            name: Start zone 1
            icon: mdi:play
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.irrigation_zone_1
          - type: button
            name: Stop zone 1
            icon: mdi:stop
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.irrigation_zone_1
          - type: button
            name: Preview zone 1
            icon: mdi:eye
            tap_action:
              action: call-service
              service: hunter_irrigation.preview_zone
              data:
                zone_entity: valve.irrigation_zone_1

      - type: horizontal-stack
        cards:
          - type: button
            name: Start zone 2
            icon: mdi:play
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.irrigation_zone_2
          - type: button
            name: Stop zone 2
            icon: mdi:stop
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.irrigation_zone_2
          - type: button
            name: Preview zone 2
            icon: mdi:eye
            tap_action:
              action: call-service
              service: hunter_irrigation.preview_zone
              data:
                zone_entity: valve.irrigation_zone_2
