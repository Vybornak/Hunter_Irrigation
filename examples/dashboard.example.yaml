# Hunter Irrigation dashboard tailored to your current entity list.
# Paste into one VIEW raw editor (not whole dashboard YAML).

type: sections
max_columns: 2
title: Hunter Irrigation
path: hunter-irrigation
icon: mdi:sprinkler-variant
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        heading: Hunter Ovládání
        icon: mdi:sprinkler-variant

      - type: entities
        title: Režim a ochrany
        show_header_toggle: false
        entities:
          - entity: switch.hunter_irrigation_manual_override
          - entity: switch.hunter_irrigation_simulate
          - entity: number.hunter_irrigation_rain_threshold
          - entity: binary_sensor.vyborny_premyslovice_destovy_senzor

      - type: entities
        title: Délky zón
        show_header_toggle: false
        entities:
          - entity: number.hunter_irrigation_zone_1_duration
          - entity: number.hunter_irrigation_zone_2_duration
          - entity: number.hunter_irrigation_zone_3_duration

      - type: entities
        title: Přehled srážek
        show_header_toggle: false
        entities:
          - entity: sensor.hunter_irrigation_rain_yesterday
          - entity: sensor.hunter_irrigation_rain_day_before_yesterday
          - entity: sensor.hunter_irrigation_rain_last_7_days_total
          - entity: sensor.weather_station_sws_12500_denni_uhrn_srazek
          - entity: sensor.weather_station_sws_12500_srazky

      - type: entities
        title: Gardena plán (nativní)
        show_header_toggle: false
        entities:
          - entity: sensor.travnik_1_next_cycle
            name: Další cyklus zóna 1
          - entity: sensor.travnik_2_next_cycle
            name: Další cyklus zóna 2
          - entity: sensor.travnik_3_next_cycle
            name: Další cyklus zóna 3
          - entity: binary_sensor.travnik_1_watering
            name: Zóna 1 zalévá
          - entity: binary_sensor.travnik_2_watering
            name: Zóna 2 zalévá
          - entity: binary_sensor.travnik_3_watering
            name: Zóna 3 zalévá

      - type: entities
        title: Gardena auto/manual
        show_header_toggle: false
        entities:
          - entity: switch.travnik_1_automatic_watering
            name: Auto zóna 1
          - entity: switch.travnik_2_automatic_watering
            name: Auto zóna 2
          - entity: switch.travnik_3_automatic_watering
            name: Auto zóna 3
          - entity: switch.travnik_1_manual_watering
            name: Manuál zóna 1
          - entity: switch.travnik_2_manual_watering
            name: Manuál zóna 2
          - entity: switch.travnik_3_manual_watering
            name: Manuál zóna 3

      - type: horizontal-stack
        cards:
          - type: button
            name: Start zóna 1
            icon: mdi:play
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.travnik_1
          - type: button
            name: Stop zóna 1
            icon: mdi:stop
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.travnik_1
          - type: button
            name: Preview zóna 1
            icon: mdi:eye
            tap_action:
              action: call-service
              service: hunter_irrigation.preview_zone
              data:
                zone_entity: valve.travnik_1

      - type: horizontal-stack
        cards:
          - type: button
            name: Start zóna 2
            icon: mdi:play
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.travnik_2
          - type: button
            name: Stop zóna 2
            icon: mdi:stop
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.travnik_2
          - type: button
            name: Preview zóna 2
            icon: mdi:eye
            tap_action:
              action: call-service
              service: hunter_irrigation.preview_zone
              data:
                zone_entity: valve.travnik_2

      - type: horizontal-stack
        cards:
          - type: button
            name: Start zóna 3
            icon: mdi:play
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.travnik_3
          - type: button
            name: Stop zóna 3
            icon: mdi:stop
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.travnik_3
          - type: button
            name: Preview zóna 3
            icon: mdi:eye
            tap_action:
              action: call-service
              service: hunter_irrigation.preview_zone
              data:
                zone_entity: valve.travnik_3

  - type: grid
    cards:
      - type: heading
        heading: Počasí
        icon: mdi:weather-partly-cloudy

      - type: weather-forecast
        entity: weather.ipemys5
        forecast_type: daily

      - type: entities
        title: Meteostanice SWS 12500
        show_header_toggle: false
        entities:
          - entity: sensor.weather_station_sws_12500_venkovni_teplota
          - entity: sensor.weather_station_sws_12500_venkovni_vlhkost_vzduchu
          - entity: sensor.weather_station_sws_12500_tlak_vzduchu
          - entity: sensor.weather_station_sws_12500_rychlost_vetru
          - entity: sensor.weather_station_sws_12500_poryvy_vetru
          - entity: sensor.weather_station_sws_12500_uv_index
          - entity: sensor.weather_station_sws_12500_slunecni_osvit
