start_zone:
  description: "Spusti nakonfigurovanou zavlahovou zonu s vyhodnocenim deste a override logiky."
  fields:
    zone:
      description: "Nazev nakonfigurovane zony ke spusteni."
      example: "zone_1"
    zone_entity:
      description: "Entity id ventilu nebo switche ke spusteni."
      example: "valve.travnik_1"
    duration_min:
      description: "Volitelna doba behu v minutach."
      example: 15
    skip_rain_check:
      description: "Pokud je true, ignoruje senzory deste a vynuti spusteni zony."
      example: false
stop_zone:
  description: "Zastavi aktualne bezici zavlahovou zonu."
  fields:
    zone:
      description: "Nazev nakonfigurovane zony k zastaveni."
      example: "zone_1"
    zone_entity:
      description: "Entity id ventilu nebo switche k zastaveni."
      example: "valve.travnik_1"
preview_zone:
  description: "Vyhodnoti podminky deste, override a simulace bez fyzickeho otevreni zony."
  fields:
    zone:
      description: "Nazev nakonfigurovane zony pro preview test."
      example: "zone_1"
    zone_entity:
      description: "Entity id ventilu nebo switche pro preview test."
      example: "valve.travnik_1"
    duration_min:
      description: "Volitelna doba behu v minutach pro preview test."
      example: 15
