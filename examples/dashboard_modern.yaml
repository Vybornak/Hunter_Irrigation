# Hunter Irrigation - Compact and stable dashboard
# Uses only entities verified in entities.txt

type: sections
title: Hunter Irrigation Control
path: hunter-irrigation
icon: mdi:sprinkler-variant

badges:
  - entity: sensor.travnik_1_next_cycle
    name: Další cyklus Z1
    icon: mdi:calendar-arrow-right
  - entity: sensor.travnik_2_next_cycle
    name: Další cyklus Z2
    icon: mdi:calendar-arrow-right
  - entity: sensor.travnik_3_next_cycle
    name: Další cyklus Z3
    icon: mdi:calendar-arrow-right
  - entity: sensor.hunter_irrigation_rain_guard_status
    name: Rain Guard
    icon: mdi:shield-check
  - entity: sensor.hunter_irrigation_rain_guard_reason
    name: Důvod blokace
    icon: mdi:alert-circle-outline
  - entity: switch.hunter_irrigation_manual_override
    name: Ruční přepsání
    icon: mdi:hand-back-right
  - entity: switch.hunter_irrigation_simulate
    name: Simulace
    icon: mdi:flask-outline

sections:

  - type: grid
    title: Zóny
    columns: 3
    cards:
      - type: entities
        title: Zóna 1 - Přední trávník
        entities:
          - entity: binary_sensor.travnik_1_watering
            name: Zalévání
          - entity: number.hunter_irrigation_zone_1_duration
            name: Délka (min)
          - entity: switch.travnik_1_automatic_watering
            name: Automatický režim
          - entity: switch.travnik_1_manual_watering
            name: Manuální režim

      - type: entities
        title: Zóna 2 - Boční trávník
        entities:
          - entity: binary_sensor.travnik_2_watering
            name: Zalévání
          - entity: number.hunter_irrigation_zone_2_duration
            name: Délka (min)
          - entity: switch.travnik_2_automatic_watering
            name: Automatický režim
          - entity: switch.travnik_2_manual_watering
            name: Manuální režim

      - type: entities
        title: Zóna 3 - Zahrada
        entities:
          - entity: binary_sensor.travnik_3_watering
            name: Zalévání
          - entity: number.hunter_irrigation_zone_3_duration
            name: Délka (min)
          - entity: switch.travnik_3_automatic_watering
            name: Automatický režim
          - entity: switch.travnik_3_manual_watering
            name: Manuální režim

  - type: grid
    title: Rychlé akce
    columns: 3
    cards:
      - type: button
        name: Start Z1
        icon: mdi:play
        icon_height: 20px
        tap_action:
          action: call-service
          service: hunter_irrigation.start_zone
          data:
            zone_entity: valve.travnik_1

      - type: button
        name: Start Z2
        icon: mdi:play
        icon_height: 20px
        tap_action:
          action: call-service
          service: hunter_irrigation.start_zone
          data:
            zone_entity: valve.travnik_2

      - type: button
        name: Start Z3
        icon: mdi:play
        icon_height: 20px
        tap_action:
          action: call-service
          service: hunter_irrigation.start_zone
          data:
            zone_entity: valve.travnik_3

      - type: button
        name: Stop Z1
        icon: mdi:stop
        icon_height: 20px
        tap_action:
          action: call-service
          service: hunter_irrigation.stop_zone
          data:
            zone_entity: valve.travnik_1

      - type: button
        name: Stop Z2
        icon: mdi:stop
        icon_height: 20px
        tap_action:
          action: call-service
          service: hunter_irrigation.stop_zone
          data:
            zone_entity: valve.travnik_2

      - type: button
        name: Stop Z3
        icon: mdi:stop
        icon_height: 20px
        tap_action:
          action: call-service
          service: hunter_irrigation.stop_zone
          data:
            zone_entity: valve.travnik_3