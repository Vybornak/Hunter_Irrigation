# Hunter Irrigation - Focus Dashboard
# Paste into one VIEW raw editor (not whole dashboard YAML).
# Priorita: rychlá orientace, minimum scrollu, jasny rain-stop stav.

type: custom:grid-layout
layout:
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr))
  gap: 12px
  margin: 0
title: Hunter Irrigation
path: hunter-irrigation
icon: mdi:sprinkler-variant
cards:
  - type: vertical-stack
    cards:
      - type: heading
        heading: Stav & Ovladani
        icon: mdi:sprinkler-variant

      - type: glance
        title: Rain Guard (chipy)
        columns: 2
        show_icon: true
        show_name: true
        show_state: true
        state_color: true
        entities:
          - entity: sensor.hunter_irrigation_rain_guard_status
            name: Status
            icon: mdi:shield-check
          - entity: sensor.hunter_irrigation_rain_guard_reason
            name: Duvod
            icon: mdi:alert-circle-outline

      - type: glance
        title: Zony - Bezi ted
        columns: 3
        show_icon: true
        show_name: true
        show_state: true
        state_color: true
        entities:
          - entity: binary_sensor.travnik_1_watering
            name: Z1
            icon: mdi:water-play
          - entity: binary_sensor.travnik_2_watering
            name: Z2
            icon: mdi:water-play
          - entity: binary_sensor.travnik_3_watering
            name: Z3
            icon: mdi:water-play

      - type: glance
        title: Rezim zony
        columns: 3
        show_icon: true
        show_name: true
        show_state: true
        state_color: true
        entities:
          - entity: switch.travnik_1_automatic_watering
            name: Z1 Auto
            icon: mdi:robot
          - entity: switch.travnik_2_automatic_watering
            name: Z2 Auto
            icon: mdi:robot
          - entity: switch.travnik_3_automatic_watering
            name: Z3 Auto
            icon: mdi:robot
          - entity: switch.travnik_1_manual_watering
            name: Z1 Manu
            icon: mdi:hand-back-right
          - entity: switch.travnik_2_manual_watering
            name: Z2 Manu
            icon: mdi:hand-back-right
          - entity: switch.travnik_3_manual_watering
            name: Z3 Manu
            icon: mdi:hand-back-right

      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            name: Start Z1
            icon: mdi:play-circle
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.travnik_1
          - type: button
            name: Start Z2
            icon: mdi:play-circle
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.travnik_2
          - type: button
            name: Start Z3
            icon: mdi:play-circle
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.travnik_3
          - type: button
            name: Stop Z1
            icon: mdi:stop-circle
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.travnik_1
          - type: button
            name: Stop Z2
            icon: mdi:stop-circle
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.travnik_2
          - type: button
            name: Stop Z3
            icon: mdi:stop-circle
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.travnik_3

  - type: vertical-stack
    cards:
      - type: heading
        heading: Srazky & Plan
        icon: mdi:water-percent

      - type: entities
        title: Srazkove statistiky
        show_header_toggle: false
        entities:
          - entity: sensor.hunter_irrigation_rain_last_24_hours_total
            name: Poslednich 24 h
          - entity: sensor.hunter_irrigation_rain_last_48_hours_total
            name: Poslednich 48 h
          - entity: sensor.hunter_irrigation_rain_yesterday
            name: Vcera
          - entity: sensor.hunter_irrigation_rain_day_before_yesterday
            name: Predvcerejsek
          - entity: sensor.hunter_irrigation_rain_last_7_days_total
            name: Poslednich 7 dni
          - entity: sensor.weather_station_sws_12500_denni_uhrn_srazek
            name: Dnes (zatim)
          - entity: sensor.weather_station_sws_12500_srazky
            name: Aktualni srazky

      - type: entities
        title: Dalsi politi
        show_header_toggle: false
        entities:
          - entity: sensor.travnik_1_next_cycle
            name: Zona 1
          - entity: sensor.travnik_2_next_cycle
            name: Zona 2
          - entity: sensor.travnik_3_next_cycle
            name: Zona 3

      - type: weather-forecast
        entity: weather.ipemys5
        forecast_type: daily

  - type: vertical-stack
    cards:
      - type: heading
        heading: Nastaveni
        icon: mdi:cog

      - type: entities
        title: Delka zon (min)
        show_header_toggle: false
        entities:
          - entity: number.hunter_irrigation_zone_1_duration
          - entity: number.hunter_irrigation_zone_2_duration
          - entity: number.hunter_irrigation_zone_3_duration

      - type: entities
        title: Rain guard rezim
        show_header_toggle: false
        entities:
          - entity: switch.hunter_irrigation_manual_override
            name: Manual override (ignoruj dest)
          - entity: switch.hunter_irrigation_simulate
            name: Simulace (bez fyzickeho otevreni)
          - entity: number.hunter_irrigation_rain_threshold
            name: Limit srazek 24 h (mm)
          - entity: number.hunter_irrigation_rain_threshold_48h
            name: Limit srazek 48 h (mm)
