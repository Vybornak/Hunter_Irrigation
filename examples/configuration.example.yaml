# Ukazkova konfigurace pro vlastni integraci Hunter Irrigation.
# Ulozte tento soubor a nacti jej z configuration.yaml pres:
# hunter_irrigation: !include irrigation/hunter_irrigation_example.yaml

hunter_irrigation:
  zones:
    - name: zone_1
      entity_id: valve.travnik_1
      duration_min: 15
    - name: zone_2
      entity_id: valve.travnik_2
      duration_min: 15
    - name: zone_3
      entity_id: valve.travnik_3
      duration_min: 15

  rain:
    daily_rain_sensor: sensor.weather_station_sws_12500_denni_uhrn_srazek
    instant_rain_sensor: sensor.weather_station_sws_12500_srazky
    rain_binary_sensor: binary_sensor.vyborny_premyslovice_destovy_senzor
    threshold_mm: 2.0
