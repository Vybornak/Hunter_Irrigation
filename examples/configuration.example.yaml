# ============================================================
#  Konfigurace Hunter Irrigation – vložte do configuration.yaml
# ============================================================
#
# KROK 1: Doplňte entity_id vašich ventilů/spínačů v sekcí zones.
#         Každý ventil musí existovat v Home Assistant jako entita
#         (switch, valve nebo input_boolean) PŘED restartem HA.
#
# KROK 2: Uložte configuration.yaml a restartujte Home Assistant.
#
# KROK 3: Po restartu integrace automaticky vytvoří:
#           number.hunter_irrigation_zone_1_duration (a zone_2, zone_3 …)
#           number.hunter_irrigation_rain_threshold
#           switch.hunter_irrigation_manual_override
#           switch.hunter_irrigation_simulation
#         Tyto entity pak použijte v dashboardu.
#
# KROK 4: Importujte dashboard z examples/dashboard.example.yaml.
# ============================================================

hunter_irrigation:
  zones:
    - name: zone_1
      entity_id: valve.travnik_1
      duration_min: 15
    - name: zone_2
      entity_id: valve.travnik_2
      duration_min: 15
    - name: zone_3
      entity_id: valve.travnik_3
      duration_min: 10

  # manual_override a simulate NEUVADEJTE zde – integrace je vytvari automaticky
  # jako switch.hunter_irrigation_manual_override / switch.hunter_irrigation_simulation

  rain:
    daily_rain_sensor: sensor.weather_station_sws_12500_denni_uhrn_srazek
    instant_rain_sensor: sensor.weather_station_sws_12500_srazky
    rain_binary_sensor: binary_sensor.vyborny_premyslovice_destovy_senzor
    threshold_mm: 2.0
