start_zone:
  description: "Start a configured irrigation zone using rain and override logic."
  fields:
    zone:
      description: "Configured zone name to start."
      example: "zone_1"
    zone_entity:
      description: "Entity id of the valve or switch to start."
      example: "valve.travnik_1"
    duration_min:
      description: "Optional run duration in minutes."
      example: 15
    skip_rain_check:
      description: "If true, ignore rain sensors and force the zone to start."
      example: false
stop_zone:
  description: "Stop a currently running irrigation zone."
  fields:
    zone:
      description: "Configured zone name to stop."
      example: "zone_1"
    zone_entity:
      description: "Entity id of the valve or switch to stop."
      example: "valve.travnik_1"
preview_zone:
  description: "Evaluate rain, override, and simulation conditions without opening the zone."
  fields:
    zone:
      description: "Configured zone name to preview."
      example: "zone_1"
    zone_entity:
      description: "Entity id of the valve or switch to preview."
      example: "valve.travnik_1"
    duration_min:
      description: "Optional run duration to preview."
      example: 15
