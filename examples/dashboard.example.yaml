# Hunter Irrigation dashboard example for "Sections" view.
#
# Paste into one VIEW raw editor (not whole dashboard YAML).
#
# Replace placeholders:
# - valve.irrigation_zone_1 / valve.irrigation_zone_2
# - number.hunter_irrigation_zone_1_duration / zone_2_duration
#
# Optional cards can be removed if you do not use rain sensors.

type: sections
max_columns: 2
title: Hunter Irrigation
path: irrigation
icon: mdi:sprinkler-variant
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        heading: Ovládání
        icon: mdi:sprinkler-variant

      - type: entities
        title: Režim
        show_header_toggle: false
        entities:
          - entity: switch.hunter_irrigation_manual_override
          - entity: switch.hunter_irrigation_simulation
          - entity: number.hunter_irrigation_rain_threshold

      - type: entities
        title: Přehled srážek
        show_header_toggle: false
        entities:
          - entity: sensor.hunter_irrigation_rain_yesterday
          - entity: sensor.hunter_irrigation_rain_day_before_yesterday
          - entity: sensor.hunter_irrigation_rain_last_7_days_total

      - type: entities
        title: Srážkové senzory (volitelné)
        show_header_toggle: false
        entities:
          - entity: sensor.daily_rain_mm
            name: Denní srážky
          - entity: sensor.instant_rain_mm
            name: Okamžité srážky
          - entity: binary_sensor.rain_detected
            name: Dešťový senzor

      - type: entities
        title: Délky zón
        show_header_toggle: false
        entities:
          - entity: number.hunter_irrigation_zone_1_duration
          - entity: number.hunter_irrigation_zone_2_duration

      - type: tile
        entity: valve.irrigation_zone_1
        name: Zóna 1 ventil
      - type: horizontal-stack
        cards:
          - type: button
            name: Start zóna 1
            icon: mdi:play
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.irrigation_zone_1
          - type: button
            name: Stop zóna 1
            icon: mdi:stop
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.irrigation_zone_1
          - type: button
            name: Preview zóna 1
            icon: mdi:eye
            tap_action:
              action: call-service
              service: hunter_irrigation.preview_zone
              data:
                zone_entity: valve.irrigation_zone_1

      - type: tile
        entity: valve.irrigation_zone_2
        name: Zóna 2 ventil
      - type: horizontal-stack
        cards:
          - type: button
            name: Start zóna 2
            icon: mdi:play
            tap_action:
              action: call-service
              service: hunter_irrigation.start_zone
              data:
                zone_entity: valve.irrigation_zone_2
          - type: button
            name: Stop zóna 2
            icon: mdi:stop
            tap_action:
              action: call-service
              service: hunter_irrigation.stop_zone
              data:
                zone_entity: valve.irrigation_zone_2
          - type: button
            name: Preview zóna 2
            icon: mdi:eye
            tap_action:
              action: call-service
              service: hunter_irrigation.preview_zone
              data:
                zone_entity: valve.irrigation_zone_2
