name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (example: 1.0.1)"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          version = "${{ inputs.version }}"
          path = Path("custom_components/hunter_irrigation/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = version
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/hunter_irrigation/manifest.json
          git commit -m "Release ${VERSION}" || echo "No changes to commit"

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "${VERSION}" || echo "Tag already exists"

      - name: Push changes and tags
        run: |
          git push
          git push --tags

      - name: Pack integration
        run: |
          mkdir -p dist
          cd custom_components/hunter_irrigation && zip -r ../../dist/hunter_irrigation.zip .

      - name: Build release notes from selected version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - << 'PY'
          import re
          from datetime import datetime
          from pathlib import Path

          version = "${{ inputs.version }}"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = changelog.splitlines()

          start_idx = None
          for idx, line in enumerate(lines):
              if re.match(rf"^##\s+\[{re.escape(version)}\](?:\s+-.*)?$", line):
                  start_idx = idx
                  break

          if start_idx is None:
              raise SystemExit(
                  f"Nelze najit sekci pro verzi {version} v CHANGELOG.md. "
                  "Nejprve ji doplnte."
              )

          end_idx = len(lines)
          for idx in range(start_idx + 1, len(lines)):
              if lines[idx].startswith("## "):
                  end_idx = idx
                  break

          body_lines = lines[start_idx + 1:end_idx]
          while body_lines and not body_lines[0].strip():
              body_lines.pop(0)

            heading = lines[start_idx]
            date_text = ""
            m = re.match(r"^##\s+\[[^\]]+\](?:\s+-\s*(.+))?$", heading)
            if m and m.group(1):
              raw_date = m.group(1).strip()
              try:
                dt = datetime.strptime(raw_date, "%Y-%m-%d")
                date_text = f"{dt.day}.{dt.month}.{dt.year}"
              except ValueError:
                date_text = raw_date

            header_line = f"[{version}]"
            if date_text:
              header_line += f" - {date_text}"

            body = "\n".join(body_lines).strip()
            section = f"{header_line}\n\n{body}\n"
          Path("RELEASE_NOTES.md").write_text(section, encoding="utf-8")
          PY

      - name: Create or update GitHub release
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="Hunter Irrigation ${VERSION}"
          ASSET="dist/hunter_irrigation.zip"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${ASSET}" --clobber
            if [ "${PRERELEASE}" = "true" ]; then
              gh release edit "${VERSION}" --title "${TITLE}" --notes-file RELEASE_NOTES.md --prerelease
            else
              gh release edit "${VERSION}" --title "${TITLE}" --notes-file RELEASE_NOTES.md
            fi
          else
            if [ "${PRERELEASE}" = "true" ]; then
              gh release create "${VERSION}" "${ASSET}" --title "${TITLE}" --notes-file RELEASE_NOTES.md --prerelease
            else
              gh release create "${VERSION}" "${ASSET}" --title "${TITLE}" --notes-file RELEASE_NOTES.md
            fi
          fi

