name: Validate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
  pull_request:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Hassfest (retry)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/home-assistant/hassfest:latest"

          # GHCR can occasionally time out on hosted runners; retry pull/run.
          for i in 1 2 3; do
            echo "Attempt $i: docker pull $IMAGE"
            if docker pull "$IMAGE"; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Failed to pull $IMAGE after 3 attempts"
              exit 1
            fi
            sleep 20
          done

          for i in 1 2 3; do
            echo "Attempt $i: run hassfest"
            if docker run --rm -v "${{ github.workspace }}:/github/workspace" "$IMAGE"; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Hassfest failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done
